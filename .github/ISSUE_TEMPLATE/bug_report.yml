name: バグ報告 / Bug report
description: 個人情報や非公開音声を添付せず、再現可能な問題を報告します。 / Report a reproducible problem without private audio or personal data.
title: "[バグ / Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 録音音声、非公開アバターパッケージ、認証情報、個人情報を添付しないでください。 / Do not attach captured voice, private avatar packages, credentials, or personal information.
  - type: input
    id: version
    attributes:
      label: バージョン / Version
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: 形式 / Format
      options:
        - VST3
        - Standalone
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順 / Reproduction steps
      description: 可能な限り合成音など機密性のない素材を使用してください。 / Use synthetic or non-sensitive test material where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作 / Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作 / Actual behavior
    validations:
      required: true
